difficulty: apprentice
safety: yellow
time_to_complete: days
yield: A 1 m3 bin holds roughly 600-800 kg of dry grain
season: Immediately after harvest; cool, dry grain stores best
storage: Dry to 12-14% moisture; 6-24 months in hermetic or well-sealed storage
cost: medium
hazards:
- Mould and aflatoxin from damp grain
- Dust explosion and fumigant poisoning
- Bin collapse or engulfment
- Rodents, insects, and birds
prerequisites:
- pnk:01HZX0K8J9Q7R3VY6T2M4B8N25/agriculture/grain-cultivation
materials_required:
- Raised, sealed bin or hermetic bags
- Moisture meter
- Clean tarps
- Diatomaceous earth
- Pallets
- Rodent-proof mesh
- Labels
tools_required:
- Moisture meter
- Scale
- Scoop
- Broom
- Thermometer probe
- Sealer
