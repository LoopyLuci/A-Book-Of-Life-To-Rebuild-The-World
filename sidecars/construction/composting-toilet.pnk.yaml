safety: red
time_to_complete: weeks
yield: A twin-vault toilet serving a household of five, with one vault curing while the other fills
season: Build in dry weather; start with a dry vault and keep rainwater out
storage: Cure removed material under cover for 12-24 months before garden use
cost: medium
hazards:
- Pathogen exposure from fresh waste and leachate
- Groundwater contamination
- Methane and ammonia in vaults
- Falls and cuts during construction
resource_budget:
  batch: one household of five for one year
  labor_hours: 40
  energy_kwh: 0
  water_liters: 50
lifespan: A well-built vault can last 10-20 years with repairs
maintenance: Add cover after each use, check the vent monthly, and cure each batch for 12-24 months
limits:
- Not suitable on sites with a high water table or frequent flooding
- Do not apply fresh or partly cured material to ready-to-eat crops
- Do not enter a vault; ventilate and use tools from outside
