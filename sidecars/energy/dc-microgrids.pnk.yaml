difficulty: journeyman
safety: red
time_to_complete: weeks
yield: A 1 kW solar and battery microgrid with protected branch circuits for critical loads
season: Install in dry weather; size for the shortest solar day of the year
storage: Keep batteries ventilated, cool, and above the manufacturer's minimum charge
cost: high
hazards:
- Electric shock and arc flash
- Battery short circuits and hydrogen release
- Fire from undersized or AC-rated protection
- Falls during panel installation
resource_budget:
  batch: one 1 kW PV and 5 kWh battery microgrid
  labor_hours: 24
  energy_kwh: 0
  water_liters: 10
lifespan: Panels last 20-25 years; batteries 3-15 years depending on chemistry and cycling
maintenance: Inspect terminals monthly; clean panels seasonally; check torque yearly
limits:
- Do not use AC-rated breakers or fuses on DC circuits
- Do not connect to grid or generator without approved transfer equipment
- Do not mix battery ages, capacities, or chemistries
