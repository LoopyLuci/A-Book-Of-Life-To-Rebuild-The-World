- Charge controller
- Battery bank
- DC busbars and fuses
- DC-rated breakers
- Copper cable and lugs
- Grounding rod
- Distribution box and labels
tools_required:
- Multimeter
- Clamp meter
- Insulated screwdrivers
- Crimping tool
- Torque wrench
- Drill
