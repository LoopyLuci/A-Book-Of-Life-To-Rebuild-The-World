title: Map Making
domain: knowledge
tags:
- maps
- surveying
- navigation
- cartography
- records
difficulty: apprentice
safety: green
time_to_complete: days
yield: A scaled sketch map of about 1 square kilometre with bearings, distances, water, and hazards
season: Survey in dry, clear weather; leaf cover and floods hide features in wet seasons
storage: Keep the master map flat, dry, and out of sunlight; store a digital copy separately
cost: low
hazards:
- Traffic and trespassing while surveying
- River crossings and steep ground
- Exposure to heat, cold, and storms
- Over-reliance on a phone battery
resource_budget:
  batch: one 1 square kilometre sketch map
  labor_hours: 16
  energy_kwh: 0
  water_liters: 5
lifespan: A local map remains useful for 5-10 years if updated
maintenance: Correct after new roads, bridges, or flood damage; recheck declination yearly
limits:
- A sketch map is not a legal property survey
- Magnetic bearings must be corrected for declination
- Do not enter restricted or unsafe areas without permission
prerequisites: []
materials_required:
- Compass
- Measuring tape or rope
- Graph paper and clipboard
- Pencil and eraser
- GPS or phone
- Range poles
- Waterproof map case
tools_required:
- Compass
- Measuring tape
- Clinometer or level
- GPS
- Ruler and protractor
