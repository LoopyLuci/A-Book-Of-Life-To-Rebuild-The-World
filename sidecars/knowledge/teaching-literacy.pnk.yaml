title: Teaching Literacy
domain: knowledge
tags:
- literacy
- education
- teaching
- reading
- community
difficulty: apprentice
safety: green
time_to_complete: months
yield: A 12-week small-group sequence taking non-readers through letter sounds, blending, and short sentences
season: Run in the off-season or evening; keep sessions short and regular
storage: Keep lesson cards, readers, and learner records dry and organised
cost: low
hazards:
- Learner dropout from embarrassment or punishment
- Eye strain from poor lighting
- Loss of records and materials
- Exclusion of learners with disabilities
resource_budget:
  batch: one class of 10 learners for 12 weeks
  labor_hours: 60
  energy_kwh: 0
  water_liters: 10
lifespan: A lesson sequence remains usable for 1-3 years with revision
maintenance: Review assessments each term and replace worn cards and readers
limits:
- Not a substitute for trained teachers in formal certification
- Do not use corporal punishment or public shaming
- Adapt examples and orthography to the local language
prerequisites: []
materials_required:
- Chalkboard or large paper
- Letter and word cards
- Decodable readers
- Notebooks and pencils
- Assessment sheets
- Picture cards
tools_required:
- Chalk or markers
- Timer
- Scissors
- Ruler
