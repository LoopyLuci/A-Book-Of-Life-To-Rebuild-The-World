yield: 10-30 km per day unloaded; 20-50 kg with a rack and low gearing
season: Year-round; clean and lubricate more often in rain and dust
storage: Store dry, keep tyres inflated, and hang or support the frame to avoid flat spots
cost: low
hazards:
- Brake or tyre failure in traffic
- Load shifting and loss of steering
- Hand and chain injuries
- Exertion and heat illness
