materials_required:
- Spare inner tubes
- Patch kit
- Tyre levers
- Hand pump
- Chain lubricant
- Brake pads and cable
- Spoke wrench
- Rack and panniers
tools_required:
- Tyre levers
- Adjustable wrench
- Screwdriver
- Chain tool
- Pump
- Rag and brush
