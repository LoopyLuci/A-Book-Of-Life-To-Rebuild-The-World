yield: 60-150 kg per animal depending on species and condition; 10-30 km per day on good trails
season: Avoid midday heat; plan around grazing and water availability
storage: Store saddles and pads dry; keep feed covered and water clean
cost: high
hazards:
- Bites, kicks, and crushing injuries
- Load shifting or a fall on steep ground
- Saddle sores and heat stress
- Animal illness or exhaustion
