title: Rainwater Harvesting
domain: water
tags:
- water
- rainwater
- storage
- roofing
- sanitation
difficulty: apprentice
safety: yellow
time_to_complete: days
yield: 0.6-0.9 L per m² of roof per mm of rain; a 100 m² roof in an 800 mm climate can collect 48,000-72,000 L per year
season: Wet season for collection; stored water carries the household through dry months
storage: Covered, dark tank; use within 6-12 months and treat before drinking
cost: medium
hazards:
- Pathogens and heavy metals washed from the roof
- Mosquito breeding in open tanks
- Drowning or falls in large open cisterns
- Tank or stand collapse under full load
prerequisites: []
materials_required:
- Roof catchment area
- Gutters and downpipes
- First-flush diverter
- Leaf screen
- Food-grade storage tank
- Overflow pipe
- Chlorine or other disinfectant
- Filter sand and gravel
tools_required:
- Tape measure
- Saw
- Drill
- Ladder
- Spirit level
- Shovel
- Pipe wrench
