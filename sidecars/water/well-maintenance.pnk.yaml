id: pnk:01M5FBX2KS60NDC4XXPGS8MZEG/water/well-maintenance
title: Well Maintenance
domain: water
tags:
- water
- wells
- pump
- maintenance
- chlorination
difficulty: journeyman
safety: red
time_to_complete: weeks
yield: A serviced well with restored yield, a sealed wellhead, and a documented disinfection record
season: Service in the dry season when demand is lower and access is safer
storage: Keep spare seals, gaskets, and a capped chlorine stock away from children
cost: medium
hazards:
- Confined-space gases and low oxygen in dug wells
- Electric shock from submersible pumps
- Chlorine burns and toxic gas
- Crushing injury from pump assemblies
resource_budget:
  batch: one 10 m hand-dug or bored well
  labor_hours: 24
  energy_kwh: 0
  water_liters: 500
lifespan: A properly sealed well can serve 20-50 years with annual service
maintenance: Inspect the seal and pump quarterly; disinfect after flooding or repairs
limits:
- Never enter a well without confined-space training and gas testing
- Do not shock chlorinate without bypassing filters and warning users
- Do not restore a well to service until chlorine and bacteria tests pass
prerequisites:
- pnk:01M52TVJZRTVXD39N579XJ4TEK/construction/water-wells
- pnk:01M5FBX2KSBN9EJMP3H00WRJYQ/water/water-quality-testing
materials_required:
- Pump seals and gaskets
- Chlorine bleach with known concentration
- Chlorine and pH test kits
- Clean buckets and brushes
- Well cap and screened vent
- Concrete sealant
- New safety rope
tools_required:
- Pipe wrench and wrench set
- Pump puller or tripod and winch
- Water level meter
- Gloves and eye protection
- Funnel
