title: Safe Household Water Storage
domain: water
tags:
- water
- storage
- sanitation
- chlorination
- public-health
difficulty: novice
safety: yellow
time_to_complete: hours
yield: Plan 4 L per person per day for survival and 15-20 L for drinking, cooking, and hygiene
season: Year-round; build reserves before dry or disaster seasons
storage: Treated water keeps 6-12 months in a clean, covered, dark container; rotate and retest regularly
cost: low
hazards:
- Bacterial regrowth in warm or opened containers
- Chemical leaching from non-food-grade plastic
- Drowning in open tanks
- Cross-contamination from dirty hands or dippers
prerequisites:
- pnk:01HZX0K8J9Q7R3VY6T2M4B8N1Q/survival/water-purification
materials_required:
- Food-grade HDPE, steel, or concrete tank
- Fitted lid
- Tap or spigot
- Sediment filter
- Chlorine test kit or pool-test strips
- Pallet or raised base
tools_required:
- Drill
- Pipe wrench
- Measuring tape
- Clean funnel
- Scrub brush
