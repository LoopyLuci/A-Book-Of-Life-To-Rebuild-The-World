title: Spring Development and Protection
domain: water
tags:
- water
- springs
- gravity-feed
- construction
- sanitation
difficulty: journeyman
safety: yellow
time_to_complete: weeks
yield: Measure dry-season flow; a protected spring box should hold 1-2 days of demand
season: Develop in the dry season so flow and water table are at their lowest
storage: Spring box or break-pressure tank; keep the collection area fenced and free of animals
cost: medium
hazards:
- Trench collapse during excavation
- Contamination from surface runoff and livestock
- Drowning in an uncovered box
- Damage to downstream water rights
prerequisites: []
materials_required:
- Stone or concrete
- Gravel and sand filter pack
- Collection pipe
- Overflow pipe
- Clay or mortar seal
- Fence posts
- Cover slab
tools_required:
- Shovel
- Pickaxe
- Wheelbarrow
- Spirit level
- Pipe cutter
- Measuring container and stopwatch
