difficulty: apprentice
safety: yellow
time_to_complete: days
yield: 50-80% of household wastewater; a low-use household can recover 100-150 L per day
season: Growing season, when plants can use the water; do not store between irrigations
storage: Use within 24 hours; no long-term storage without treatment
cost: low
hazards:
- Pathogens from laundry, bath, and hand-washing water
- Salt and boron accumulation in soil
- Groundwater contamination
- Mosquito breeding in stagnant pools
prerequisites:
- pnk:01M5E8W7W19VHR92PCP24VN08X/water/water-storage
materials_required:
- Diverter valve
- Greywater-safe pipe
- Mulch basin or subsurface irrigation line
- Gravel
- Filter screen
- Soap without borax or heavy bleach
tools_required:
- Shovel
- Pipe cutter
- Spirit level
- Bucket
- Gloves
