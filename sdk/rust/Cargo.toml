[package]
name = "abook"
version = "1.0.0"
edition = "2021"
description = "Rust SDK for A Book Of Life To Rebuild The World."
license = "MIT"
repository = "https://github.com/LoopyLuci/A-Book-Of-Life-To-Rebuild-The-World"
readme = "README.md"

[dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = "2"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
