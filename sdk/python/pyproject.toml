[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "abook-sdk"
version = "1.0.0"
description = "Python SDK for A Book Of Life To Rebuild The World."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "A Book Of Life Contributors" }]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[tool.hatch.build]
# Hatchling looks for a .gitignore above this project and applies it with this
# directory as the anchor. The repository's owns an anchored `/abook` entry
# (the generated launcher at the top of the tree), which then looks like it
# excludes `sdk/python/abook` — the whole package — and the build silently
# produces a wheel with no code in it. The files to ship are declared
# explicitly below, so the VCS ignore rules are not needed here.
ignore-vcs = true

[tool.hatch.build.targets.wheel]
packages = ["abook"]
