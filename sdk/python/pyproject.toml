[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "abook-sdk"
version = "1.0.0"
description = "Python SDK for A Book Of Life To Rebuild The World."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "A Book Of Life Contributors" }]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[tool.hatch.build.targets.wheel]
packages = ["abook"]
