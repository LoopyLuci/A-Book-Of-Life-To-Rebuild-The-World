title: Illuminazione efficiente
domain: energy
tags: [illuminazione, led, efficienza, luce-diurna, aria-interna]
difficulty: novice
safety: yellow
time_to_complete: hours
hazards:
  - Monossido di carbonio e particelle delle lampade a combustibile
  - Incendio da candele e da corpi illuminanti surriscaldati
  - Scarica elettrica da cablaggi bagnati o danneggiati
  - Cadute dalle scale
limits:
  - Non usare lampade a combustibile senza ventilazione in ambienti interni per
    periodi prolungati
  - Non sovraccaricare le prolunghe e non collegare a cascata le ciastre
    multiple
  - Il flusso luminoso cala con polvere, calore e driver di scarsa qualità
