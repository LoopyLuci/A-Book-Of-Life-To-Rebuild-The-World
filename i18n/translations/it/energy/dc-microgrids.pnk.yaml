safety: red
time_to_complete: weeks
hazards:
  - Scarica elettrica e arco elettrico
  - Cortocircuiti delle batterie e rilascio di idrogeno
  - Incendio per protezioni sotto dimensionate o omologate solo per l'alternata
  - Cadute durante l'installazione dei pannelli
limits:
  - Non usare interruttori o fusibili omologati per l'alternata su circuiti in
    continua
  - Non collegarsi alla rete o a un generatore senza un dispositivo di
    commutazione approvato
  - Non mescolare batterie di età, capacità o chimica diverse
