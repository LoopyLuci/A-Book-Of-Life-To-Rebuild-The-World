title: Pesata analitica, standard e taratura
domain: chemistry
tags: [chimica, analitica, taratura, bilancia, standard]
difficulty: apprentice
safety: green
time_to_complete: hours
hazards:
  - Ustioni chimiche e spruzzi; indossa occhiali antispruzzo e guanti.
  - Inalazione di fumi; lavora in un locale ventilato o sotto cappa.
  - Fuoco e calore; tieni lontano il materiale infiammabile dai lavori a caldo.
  - I rifiuti di reagenti devono essere neutralizzati e raccolti separatamente.
limits:
  - I valori presuppongono purezza di grado di laboratorio e vetreria tarata.
  - Non sostituisce un protocollo di laboratorio controllato.
