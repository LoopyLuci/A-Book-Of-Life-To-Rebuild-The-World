title: Fissaggio del carico
domain: transport
tags: [trasporto, carico, nodi, sicurezza, logistica]
difficulty: novice
safety: yellow
time_to_complete: hours
hazards:
  - Carichi che si spostano o cadono
  - Lesioni da schiacciamento durante la messa in tensione
  - Ribaltamento di veicolo o carro
  - Cinghie danneggiate che cedono sotto carico
limits:
  - Non superare mai il limite di carico di lavoro dell'elemento più debole
  - Non agganciare le cinghie a linee di carburante, pannelli della
    carrozzeria o spigoli taglienti
  - Non trasportare passeggeri su un carico non fissato
