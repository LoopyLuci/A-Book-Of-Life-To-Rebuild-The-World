title: Analisi dei circuiti in corrente alternata e impedenza
domain: computers
tags: [computer, elettronica, corrente-alternata, impedenza, filtri]
difficulty: apprentice
safety: green
time_to_complete: hours
hazards:
  - La tensione di rete e la carica accumulata possono uccidere; metti in
    sicurezza prima di lavorare.
  - Fumi di saldatura, flusso e piombo; ventila e lavati le mani.
  - La scarica statica può danneggiare i componenti; usa un banco collegato
    a terra.
  - La perdita di dati è silenziosa; fai una copia di sicurezza prima di
    qualsiasi intervento su firmware o dischi.
limits:
  - Gli esempi presuppongono catene di strumenti open di uso comune.
  - Segui il foglio dati del costruttore più di qualsiasi sintesi.
