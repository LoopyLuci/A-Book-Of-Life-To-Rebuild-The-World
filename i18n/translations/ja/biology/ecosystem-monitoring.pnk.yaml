hazards:
- 鋭利な器具による切創。ピンセットを使用し、刃物は安全に廃棄すること。
- 生物学的汚染。培養物は蓋を閉めてラベルを付けておくこと。
- 染色液や試薬への曝露。手袋を着用し、手を洗うこと。
- 野生種や保護植物に関する地域の規則も引き続き適用される。
limits:
- 結果は地域の系統、気候、技術によって異なる。
- 未検証の材料を食品、飼料、治療に使用してはならない。
