hazards:
- 鋭利物による切り傷。ピンセットを使用し、刃物は安全に廃棄すること。
- 生物学的汚染。培養物は密閉し、ラベルを付けておくこと。
- 染色剤や試薬への曝露。手袋を着用し、手を洗うこと。
- 野生種や保護対象の植物に関する地域の規則も引き続き適用される。
limits:
- 結果は地域の系統、気候、技術によって異なる。
- 未検証の材料を食品、飼料、治療に使用してはならない。
