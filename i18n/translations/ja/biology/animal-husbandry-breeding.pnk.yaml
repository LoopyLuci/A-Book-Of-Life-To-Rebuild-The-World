hazards:
- 鋭利な器具による切創。鉗子を使用し、刃物は安全に廃棄すること。
- 生物学的汚染。培養物は密閉し、ラベルを付けておくこと。
- 染色剤や試薬への曝露。手袋を着用し、手を洗うこと。
- 野生種や保護植物に関する地域の規則は引き続き適用される。
limits:
- 結果は地域の系統、気候、技術によって異なる。
- 未検証の材料を食用、飼料用、治療用に使用してはならない。
