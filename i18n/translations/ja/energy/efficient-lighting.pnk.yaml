hazards:
- 燃料ランプから発生する一酸化炭素と微粒子
- ろうそくや過熱した器具による火災
- 濡れた、または損傷した配線による感電
- 脚立からの転落
limits:
- 換気のない燃料ランプを室内で長時間使用しないこと
- 延長コードに過負荷をかけたり、電源タップを数珠つなぎにしたりしないこと
- ほこり、熱、ドライバーの品質不良により光束（ルーメン出力）は低下する
