hazards:
- 感電およびアークフラッシュ
- 蓄電池の短絡と水素の放出
- 太さ不足または AC 定格の保護機器による火災
- パネル設置中の転落
limits:
- DC 回路に AC 定格の遮断器やヒューズを使用しないこと
- 承認された切替装置なしに系統や発電機へ接続しないこと
- 蓄電池の使用年数、容量、種類（化学系）を混在させないこと
