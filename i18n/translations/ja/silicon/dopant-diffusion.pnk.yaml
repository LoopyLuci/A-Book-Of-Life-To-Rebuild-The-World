hazards:
- 極端な高温および極低温の液体。訓練を受けた者のみが取り扱うこと。
- 有毒で腐食性のプロセスガス。警報と換気を確認すること。
- 電離放射線および紫外線への曝露。遮蔽された装置を使用すること。
- クリーンルームのプロトコルは安全対策であり、任意の慣行ではない。
