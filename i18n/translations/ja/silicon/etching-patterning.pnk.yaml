hazards:
- 極端な高温および極低温の液体があるため、訓練を受けた者のみが取り扱うこと。
- 有毒で腐食性のプロセスガスがあるため、警報と換気を確認すること。
- 電離放射線および紫外線への曝露があるため、遮蔽された装置を使用すること。
- クリーンルームの規則は安全管理策であり、任意の慣行ではない。
limits:
- 設備投資を要する装置と、専門的なプロセス管理が必要である。
- 記載した歩留まりとコストは、成熟した量産工程における典型値である。
