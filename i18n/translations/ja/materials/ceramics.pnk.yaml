- glaze
difficulty: journeyman
safety: yellow
time_to_complete: weeks
hazards:
- 粘土と釉薬に含まれる結晶質シリカ粉じん
- 窯によるやけどと火災
- 燃料焚きの窯から発生する一酸化炭素
- 安全でない釉薬による鉛または重金属中毒
limits:
- 湿ったもの、または厚さが不均一な成形品を焼成してはならない
- 食品に触れる表面に鉛釉を使用してはならない
- 全量を作る前に、粘土の収縮率と釉薬の適合性を試験すること
