hazards:
- 高所および開放水面上での作業です。墜落防止措置を使用してください。
- 火気作業、溶接ヒューム、火災監視に注意し、高温作業区域を管理してください。
- 建造中は、閉所および重量物吊り上げの危険があります。
- 船級および旗国の規則が適用されます。安全装置を即興で作ってはなりません。
limits:
- 寸法は、一般的な鋼製船体と通常の積載を前提としています。
- 法定検査および船級が引き続き優先されます。
