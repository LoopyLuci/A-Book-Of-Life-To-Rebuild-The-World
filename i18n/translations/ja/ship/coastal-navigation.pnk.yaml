hazards:
- 高所および開水面上での作業です。墜落防止措置を用いてください。
- 火気作業、溶接ヒューム、火災監視に注意し、高温作業区域を管理してください。
- 建造中は閉鎖空間および重量物の吊り上げに伴う危険があります。
- 船級規則および旗国の規則が適用されます。安全システムを独自に即興で作ってはなりません。
limits:
- 寸法は一般的な鋼製船体と通常の積載を前提としています。
- 法定検査および船級検査が引き続き権威を持ちます。
