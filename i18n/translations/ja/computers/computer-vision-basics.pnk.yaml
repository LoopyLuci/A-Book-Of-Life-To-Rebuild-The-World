hazards:
- 商用電源電圧や蓄積電荷は致命的になり得ます。作業前に必ず絶縁・遮断してください。
- はんだ煙、フラックス、鉛に注意してください。換気し、作業後は手を洗ってください。
- 静電気放電は部品を損傷する可能性があります。接地された作業台を使用してください。
- データの消失は気づかないうちに起こります。ファームウェアやディスクの作業の前にバックアップを取ってください。
limits:
- 例は主流のオープンなツールチェーンを前提としています。
