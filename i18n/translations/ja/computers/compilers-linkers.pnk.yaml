hazards:
- 商用電源の電圧と蓄積された電荷は命に関わります。作業前に必ず絶縁・遮断してください。
- はんだの煙、フラックス、鉛に注意し、換気して手を洗ってください。
- 静電気放電は部品を損傷することがあります。接地した作業台を使用してください。
- データの消失は気づかれないまま起こります。ファームウェアやディスクの作業の前にバックアップを取ってください。
limits:
