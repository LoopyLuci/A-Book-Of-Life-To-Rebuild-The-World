hazards:
- 化学熱傷や薬品の飛散の危険があります。飛沫防止ゴーグルと手袋を着用してください。
- ヒュームの吸入の危険があります。換気された場所またはヒュームフード内で作業してください。
- 火災と高温の危険があります。火気作業の周囲から可燃物を遠ざけてください。
- 試薬の廃液は中和し、別々に回収する必要があります。
