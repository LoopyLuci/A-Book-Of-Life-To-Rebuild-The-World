title: Temiz Oda Protokolleri ve Kirlilik Kontrolü
domain: silicon
tags: [silikon, temiz-oda, kirlilik, protokol, guvenlik]
difficulty: apprentice
safety: yellow
time_to_complete: hours
hazards:
  - Aşırı sıcaklık ve kriyojenik sıvılar; yalnızca eğitimli işçilik kullanın.
  - Zehirli ve aşındırıcı işlem gazları; alarmları ve havalandırmayı doğrulayın.
  - İyonize edici ve morötesinik maruziyet; kalkanlı ekipman kullanın.
  - Temiz oda protokolleri bir güvenlik kontrolüdür, isteğe bağlı bir uygulama değil.
limits:
  - Yatırım ekipmanı ve uzman süreç kontrolü gerektirir.
  - Anlatılan verim ve maliyetler olgun üretimin tipik değerleridir.
