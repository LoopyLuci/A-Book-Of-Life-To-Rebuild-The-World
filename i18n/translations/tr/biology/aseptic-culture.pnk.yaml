difficulty: apprentice
safety: yellow
time_to_complete: hours
hazards:
  - Keskin aletler ve kesikler; forseps kullanın ve bıçakları güvenli biçimde atın.
  - Biyolojik kirlilik; kültürleri kapalı ve etiketli tutun.
  - Boya ve reaktana maruz kalma; eldiven giyin ve ellerinizi yıkayın.
  - Yabani türler ve koruma altındaki bitkiler hakkındaki yerel kurallar geçerlidir.
limits:
  - Sonuçlar yerel suşlara, iklime ve tekniğe göre değişir.
  - Gıda, yem veya tedavi amaçlı asla doğrulanmamış malzeme kullanmayın.
