- Огневые работы, сварочный дым и наблюдение за пожаром; контролируйте зону горения.
- Опасности замкнутых пространств и тяжёлых подъёмов при постройке.
- Действуют требования классификационного общества и флагового государства; не импровизируйте систему безопасности.
