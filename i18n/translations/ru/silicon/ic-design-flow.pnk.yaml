hazards:
- Экстремальный нагрев и криогенные жидкости; допускаются только обученные специалисты.
- Токсичные и коррозионные технологические газы; проверьте сигнализацию и вентиляцию.
- Ионизирующее и ультрафиолетовое излучение; используйте экранированное оборудование.
- Правила чистой комнаты — это меры безопасности, а не необязательная практика.
limits:
- Требуется дорогое оборудование и специализированный контроль технологических процессов.
- Описанные выходы и затраты типичны для зрелого производства.
