hazards:
- Химическое раздражение от реактивов
- Ложная уверенность из-за отрицательного экспресс-теста
- Загрязнение проб при отборе
- Контакт со сточными водами или паводковой водой
limits:
- Полевые наборы выявляют косвенные признаки и не подтверждают микробиологическую безопасность
- Тесты на хлор не выявляют химическое загрязнение
- Ампулы H2S — это предупреждающий тест, а не лабораторное подтверждение
