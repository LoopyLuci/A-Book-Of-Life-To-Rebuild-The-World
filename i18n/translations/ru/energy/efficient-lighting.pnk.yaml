hazards:
- Монооксид углерода и мелкодисперсные частицы от ламп на жидком топливе
- Пожар от свечей и перегретых светильников
- Удар током от мокрой или повреждённой проводки
- Падения с лестниц
limits:
- Не используйте лампы на жидком топливе без вентиляции в помещении долгое время
- Не перегружайте удлинители и не соединяйте удлинители каскадом
- Световой поток падает от пыли, нагрева и низкого качества драйвера
