difficulty: journeyman
safety: red
time_to_complete: weeks
hazards:
- Удар током и дуговой разряд
- Короткие замыкания аккумуляторов и выделение водорода
- Пожар из-за недостаточной по номиналу или рассчитанной на переменный ток аппаратуры защиты
- Падения при монтаже панелей
limits:
- Не применяйте автоматы и предохранители, рассчитанные на переменный ток, в цепях постоянного тока
- Не подключайтесь к сети или генератору без одобренного переключающего устройства
- Не смешивайте аккумуляторы разного возраста, ёмкости или типа
