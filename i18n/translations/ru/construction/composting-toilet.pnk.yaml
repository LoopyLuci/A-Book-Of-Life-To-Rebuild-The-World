hazards:
- Контакт с патогенами из свежих отходов и стоков
- Загрязнение грунтовых вод
- Метан и аммиак в камерах
- Падения и порезы при постройке
limits:
- Не подходит для участков с высоким уровнем грунтовых вод или частыми наводнениями
- Не вносите свежий или частично вызревший материал под культуры, идущие в пищу без переработки
- Не заходите внутрь камеры; проветривайте и работайте инструментами снаружи
