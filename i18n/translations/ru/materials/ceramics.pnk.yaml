title: Керамика
domain: materials
tags: [keramika, glina, pech, goncharstvo, glazur]
difficulty: journeyman
safety: yellow
time_to_complete: weeks
hazards:
- Пыль кристаллического кремнезёма от глины и глазурей
- Ожоги и пожары от печей
- Монооксид углерода от печей на жидком топливе
- Отравление свинцом или тяжёлыми металлами из-за небезопасных глазурей
limits:
- Никогда не обжигайте мокрые или неравномерно толстые изделия
- Не используйте свинцовые глазури на поверхностях, контактирующих с пищей
- Проверьте усадку глины и посадку глазури до изготовления полной партии
