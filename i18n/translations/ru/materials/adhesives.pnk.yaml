difficulty: apprentice
safety: yellow
time_to_complete: hours
hazards:
- Ожоги от горячего клея и паровой ванны
- Ожоги от едкой извести или боракса
- Развитие плесени в крахмальном и кожевенном клее
- Разрушение слабых соединений под нагрузкой
limits:
- Крахмальный и кожевенный клей не водостойки
- Казеин водостоек, но не является конструкционным клеем для ответственных нагрузок
- Не применяйте неизвестные клеи на поверхностях, контактирующих с пищей или питьевой водой.
