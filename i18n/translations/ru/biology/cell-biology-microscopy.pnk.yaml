hazards:
- Острые предметы и порезы; работайте пинцетом и безопасно утилизируйте лезвия.
- Биологическое загрязнение; держите культуры закрытыми и подписанными.
- Контакт с красителями и реактивами; надевайте перчатки и мойте руки.
- Местные правила о диких видах и охраняемых растениях по-прежнему действуют.
limits:
- Результаты зависят от местных штаммов, климата и методики.
- Никогда не используйте непроверенный материал для пищи, корма или лечения.
