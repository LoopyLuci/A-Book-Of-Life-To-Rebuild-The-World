hazards:
- Сетевое напряжение и накопленный заряд смертельны; обесточьте перед началом работ.
- Пары пайки, флюс и свинец; проветривайте и мойте руки.
- Статическое электричество может повредить детали; работайте на заземлённом верстаке.
- Потеря данных происходит незаметно; делайте резервную копию перед работой с прошивкой или диском.
