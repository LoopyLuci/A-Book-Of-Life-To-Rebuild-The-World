hazards:
  - Hàng hoá dịch chuyển hoặc rơi
  - Chấn thương nghiền khi siết dây
  - Lật xe hoặc xe đẩy
  - Dây chằng hỏng đứt dưới tải
limits:
  - Không bao giờ vượt quá tải trọng làm việc của linh kiện yếu nhất
  - Không gắn dây chằng vào đường ống nhiên liệu, vỏ thân xe hoặc cạnh sắc
  - Không chở hành khách trên tải không được cố định
