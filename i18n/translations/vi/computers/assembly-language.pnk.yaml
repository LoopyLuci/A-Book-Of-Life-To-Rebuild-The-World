hazards:
  - Điện áp lưới và điện tích tích luỹ có thể gây chết người; phải cách ly trước khi làm việc.
  - Khói hàn, chất lưu và chì; hãy thông gió và rửa tay.
  - Phóng tĩnh điện có thể hỏng linh kiện; hãy dùng bàn nối đất.
  - Mất dữ liệu xảy ra trong im lặng; hãy sao lưu trước mọi thao tác với firmware hoặc ổ đĩa.
limits:
  - Các ví dụ giả định dùng bộ công cụ mã nguồn mở phổ biến.
  - Hãy làm theo datasheet của nhà sản xuất hơn bất kỳ tóm tắt nào.
