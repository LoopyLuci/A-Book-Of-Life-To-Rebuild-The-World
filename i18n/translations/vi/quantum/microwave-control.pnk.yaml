hazards:
  - Chất lỏng siêu lạnh gây bỏng lạnh và ngạt thở trong phòng kín.
  - Bức xạ vi sóng và tần số cao; hãy giới hạn trường bức xạ.
  - Tiếp xúc laser; không bao giờ nhìn vào đường truyền tia.
  - Điện áp nguy hiểm và hiện tượng mất từ trường nam châm; hãy tuân theo quy định của cơ sở.
limits:
  - Các con số chỉ mô tả các thiết bị ở quy mô phòng thí nghiệm hiện nay.
  - Nhiễu, độ trôi và giới hạn điều khiển khác nhau giữa các cơ sở.
