hazards:
  - Làm việc trên cao và trên mặt nước mở; hãy dùng thiết bị chống rơi.
  - Nhiệt hàn, khói hàn và người canh giữ hoả hoạn; hãy kiểm soát vùng nóng.
  - Nguy cơ khoang kín và nâng hàng nặng trong khi thi công.
  - Quy định về hạng tàu và cờ hiệu vẫn áp dụng; không bao giờ tự chế hệ thống an toàn.
limits:
  - Các kích thước giả định thân tàu thép thông thường và tải trọng bình thường.
  - Kiểm định pháp lý và phân cấp tàu vẫn là căn cứ có hiệu lực.
