hazards:
  - Điện giật và hồ quang điện
  - Ngắn mạch pin và giải phóng hydro
  - Cháy do thiết bị bảo vệ quá nhỏ hoặc chỉ định mức cho AC
  - Ngã trong lúc lắp tấm pin
limits:
  - Không dùng bộ ngắt mạch hoặc cầu chì định mức AC trên mạch DC
  - Không nối vào lưới điện hoặc máy phát điện nếu không có thiết bị chuyển mạch được duyệt
  - Không trộn lẫn các pin khác tuổi, khác dung lượng hoặc khác hoá học
