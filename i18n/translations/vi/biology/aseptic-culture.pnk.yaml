hazards:
  - Vật sắc và vết cắt; dùng kẹp và thải bỏ lưỡi dao an toàn.
  - Ô nhiễm sinh học; giữ mẫu nuôi kín và có dán nhãn.
  - Tiếp xúc thuốc nhuộm và hóa chất; đeo găng tay và rửa tay.
  - Quy định địa phương về loài hoang dã và cây được bảo vệ vẫn còn hiệu lực.
limits:
  - Kết quả thay đổi theo giống địa phương, khí hậu và kỹ thuật.
  - Không bao giờ dùng vật liệu chưa được kiểm chứng cho thực phẩm, thức ăn hoặc điều trị.
