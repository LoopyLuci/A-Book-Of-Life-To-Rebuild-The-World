title: Cân phân tích, chuẩn và hiệu chuẩn
domain: chemistry
tags: [hoa-hoc, phan-tich, hieu-chuan, can, chuan]
difficulty: apprentice
safety: green
time_to_complete: hours
hazards:
  - Bỏng hóa chất và văng bắn; đeo kính bảo hộ chống văng và găng tay.
  - Hít phải khói hơi; làm việc ở nơi thông gió hoặc tủ hút.
  - Cháy và nhiệt; để vật liệu dễ cháy xa khỏi công việc nóng.
  - Chất thải thuốc thử phải được trung hoà và thu gom riêng.
limits:
  - Các giá trị giả định độ tinh khiết cấp phòng thí nghiệm và dụng cụ thuỷ tinh đã hiệu chuẩn.
  - Không thay thế được cho quy trình phòng thí nghiệm có kiểm soát.
