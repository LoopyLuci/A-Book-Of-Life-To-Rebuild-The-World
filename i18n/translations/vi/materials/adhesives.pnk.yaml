difficulty: apprentice
safety: yellow
time_to_complete: hours
hazards:
  - Bỏng do keo nóng và nồi kiểu bồn nước
  - Bỏng ăn mòn do vôi hoặc borax
  - Mốc phát triển trong hồ tinh bột và keo da
  - Mối nối yếu và hỏng dưới tải
limits:
  - Hồ tinh bột và keo da không chống nước
  - Casein chống nước nhưng không phải là keo cấu trúc cho tải quan trọng an toàn
  - Không dùng keo dán không rõ nguồn gốc cho thực phẩm hoặc bề mặt tiếp xúc với nước uống
