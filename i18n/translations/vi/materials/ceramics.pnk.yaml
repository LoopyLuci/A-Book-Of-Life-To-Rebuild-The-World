hazards:
  - Bụi silica kết tinh từ đất sét và men
  - Bỏng và hoả hoạn từ lò nung
  - Carbon monoxide từ lò nung nhiên liệu
  - Ngộ độc chì hoặc kim loại nặng từ men không an toàn
limits:
  - Không bao giờ nung sản phẩm ướt hoặc dày không đều
  - Không dùng men có chì trên bề mặt tiếp xúc thực phẩm
  - Thử độ co của đất sét và độ khớp của men trước khi làm cả mẻ
