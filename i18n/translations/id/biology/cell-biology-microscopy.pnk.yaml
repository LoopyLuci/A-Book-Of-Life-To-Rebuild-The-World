hazards:
  - Benda tajam dan luka iris; gunakan pincet dan buang bilah dengan aman.
  - Kontaminasi biologis; tutup dan beri label pada kultur.
  - Paparan pewarna dan pereaksi; pakai sarung tangan dan cucilah tangan.
  - Aturan setempat tentang spesies liar dan tumbuhan terlindungi tetap berlaku.
limits:
  - Hasil bervariasi menurut strain lokal, iklim, dan teknik.
  - Jangan pernah memakai bahan yang belum diverifikasi untuk pangan, pakan, atau pengobatan.
