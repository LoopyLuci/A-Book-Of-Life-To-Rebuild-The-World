hazards:
  - Cairan kriogenik menyebabkan luka bakar dingin dan kekurangan oksigen di dalam ruangan.
  - Radiasi gelombang mikro dan frekuensi tinggi; batasi medan radiasi.
  - Paparan laser; jangan pernah melihat ke arah berkas cahaya.
  - Tegangan berbahaya dan quench magnet; ikuti aturan fasilitas.
limits:
  - Angka-angka ini hanya menggambarkan perangkat skala laboratorium saat ini.
  - Derau, drift, dan batas kendali berbeda-beda antar instalasi.
