hazards:
  - Debu silika kristalin dari tanah liat dan glasir
  - Luka bakar dan kebakaran dari kiln
  - Karbon monoksida dari kiln bahan bakar
  - Keracunan timbal atau logam berat dari glasir yang tidak aman
limits:
  - Jangan pernah membakar benda yang basah atau tidak rata
  - Jangan memakai glasir timbal pada permukaan kontak pangan
  - Uji penyusutan tanah liat dan kesesuaian glasir sebelum membuat satu batch penuh
