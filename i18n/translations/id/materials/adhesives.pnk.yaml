tags: [perekat, pati, perekat-kulit, kasein, kerja-kayu]
difficulty: apprentice
safety: yellow
time_to_complete: hours
hazards:
  - Luka bakar dari lem panas dan panci air ganda
  - Luka bakar kaustik dari kapur atau boraks
  - Pertumbuhan jamur pada perekat pati dan kulit
  - Sambungan lemah yang runtuh di bawah beban
limits:
  - Perekat pati dan perekat kulit tidak tahan air
  - Kasein tahan air tetapi bukan perekat struktural untuk beban kritis
  - Jangan memakai perekat yang tidak dikenal pada permukaan kontak pangan atau air minum
