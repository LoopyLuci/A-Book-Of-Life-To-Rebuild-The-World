hazards:
  - Tegangan listrik PLN dan muatan tersimpan dapat membunuh; putuskan sebelum bekerja.
  - Uap solder, flux, dan timbal; ventilasi dan cucilah tangan.
  - Pelepasan statis dapat merusak komponen; gunakan meja yang dibumikan.
  - Kehilangan data terjadi tanpa suara; buat cadangan sebelum mengerjakan firmware atau disk.
limits:
  - Contoh mengasumsikan toolchain sumber terbuka yang umum.
  - Ikuti datasheet produsen daripada ringkasan apa pun.
