hazards:
  - Bekerja pada ketinggian dan di atas air terbuka; pakai pelindung jatuh.
  - Pekerjaan panas, asap las, dan pemantau api; kendalikan zona panas.
  - Bahaya ruang terbatas dan penanganan beban berat saat pembangunan.
  - Aturan kelas dan bendera berlaku; jangan pernah merancang sistem keselamatan sendiri.
limits:
  - Ukuran diasumsikan untuk badan kapal baja konvensional dan pemuatan normal.
  - Survei dan klasifikasi resmi tetap menjadi rujukan.
