title: Protokol Cleanroom dan Pengendalian Kontaminasi
domain: silicon
tags: [silikon, cleanroom, kontaminasi, protokol, keselamatan]
difficulty: apprentice
safety: yellow
time_to_complete: hours
hazards:
  - Panas ekstrem dan cairan kriogenik; hanya ditangani oleh orang yang terlatih.
  - Gas proses beracun dan korosif; pastikan alarm dan ventilasi berfungsi.
  - Paparan radiasi pengion dan ultraviolet; gunakan peralatan berpelindung.
  - Protokol cleanroom adalah pengendalian keselamatan, bukan praktik opsional.
limits:
  - Memerlukan peralatan modal dan kendali proses khusus.
  - Rendemen dan biaya yang dijelaskan adalah yang lazim pada produksi matang.
