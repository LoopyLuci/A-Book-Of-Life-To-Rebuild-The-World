hazards:
  - Luka bakar dan cipratan bahan kimia; pakai kacamata semprot dan sarung tangan.
  - Menghirup uap; bekerja di ruang berventilasi atau di fume hood.
  - Api dan panas; jauhkan bahan mudah terbakar dari pekerjaan panas.
  - Limbah pereaksi harus dinetralkan dan dikumpulkan terpisah.
limits:
  - Angka-angka ini mengasumsikan kemurnian kelas laboratorium dan peralatan kaca yang terkalibrasi.
  - Tidak menggantikan prosedur laboratorium yang terkendali.
