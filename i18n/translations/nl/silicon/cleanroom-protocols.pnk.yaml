title: Cleanroomprotocollen en contaminatiebeheersing
domain: silicon
tags: [silicon, cleanroom, verontreiniging, protocol, veiligheid]
difficulty: apprentice
safety: yellow
time_to_complete: hours
hazards:
  - Extreme hitte en kryogene vloeistoffen; alleen door getraind personeel hanteren
  - Giftige en bijtende procesgassen; controleer alarms en ventilatie
  - Blootstelling aan ioniserende en ultraviolette straling; gebruik afgeschermde apparatuur
  - Cleanroomprotocollen zijn veiligheidsmaatregelen, geen optionele praktijk
limits:
  - Vereist kapitaalgoed en gespecialiseerde procesbeheersing
  - De beschreven opbrengsten en kosten zijn gangbaar voor een volwassen productie
