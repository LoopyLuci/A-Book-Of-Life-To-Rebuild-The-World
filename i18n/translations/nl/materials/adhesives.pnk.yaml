title: Lijmen
domain: materials
tags: [lijm, zetmeel, huidlijm, caseine, houtbewerking]
difficulty: apprentice
safety: yellow
time_to_complete: hours
hazards:
  - Brandwonden door hete lijm en dubbele ketels
  - Bijtende brandwonden door kalk of boorax
  - Schimmelgroei in zetmeel- en huidlijm
  - Zwakke verbindingen die onder belasting bezwijken
limits:
  - Zetmeel- en huidlijm zijn niet waterdicht
  - Caseïne is waterbestendig maar geen constructielijm voor veiligheidskritische belastingen
  - Gebruik geen onbekende lijmen op oppervlakken die met voedsel of drinkwater in contact komen
prerequisites:
  - pnk:01HZX0K8J9Q7R3VY6T2M4B8N1Z/survival/simple-tools
materials_required:
  - Tarwe- of cassavezetmeel
  - Huidlijmkorrels of -vellen
  - Caseïnemelkpoeder of magere melk
  - Gebluste kalk of boorax
  - Schoon water
  - Afvalhout voor proefverbindingen
tools_required:
  - Weegschaal
  - Dubbele ketel
  - Roerstaaf
  - Kwast
  - Schroefklemmen
  - Schuurpapier
