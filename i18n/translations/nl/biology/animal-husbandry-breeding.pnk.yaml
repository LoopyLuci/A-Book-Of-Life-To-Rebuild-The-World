hazards:
  - Scherpe voorwerpen en snijwonden; gebruik een pincet en gooi mesjes veilig af.
  - Biologische besmetting; houd kweken gesloten en goed gelabeld.
  - Blootstelling aan kleurlosstoffen en reagentia; draag handschoenen en was uw handen.
  - Lokale regels over wilde soorten en beschermde planten blijven van kracht.
limits:
