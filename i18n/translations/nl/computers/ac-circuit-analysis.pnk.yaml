hazards:
  - Netspanning en opgeslagen lading kunnen dodelijk zijn; schakel spanningsvrij vóór het werken.
  - Soldeerdampen, vloeimiddel en lood; zorg voor ventilatie en was uw handen.
  - Statische ontlading kan onderdelen beschadigen; werk op een geaarde werkbank.
  - Gegevensverlies is stil; maak een back-up vóór elke firmware- of schijfbehandeling.
limits:
  - De voorbeelden gaan uit van gangbare open toolchains.
  - Volg het datasheet van de fabrikant boven elke samenvatting.
