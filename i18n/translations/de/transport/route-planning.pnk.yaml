- Topographic maps
- Route card and pencil
- Water and feed containers
- Tire repair kit or spare parts
- Radio or charged phone
- Weather protection
tools_required:
- Compass or GPS
- Vehicle or cart
- Tool kit
- First aid kit
- Watch or phone
