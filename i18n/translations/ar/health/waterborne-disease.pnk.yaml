yield: A treated patient with a rehydration plan and a source-control record for the household
season: Peaks in rainy season, floods, and hot weather when water quality declines
storage: Keep ORS and zinc dry, in date, and stocked at every clinic
cost: low
hazards:
- Severe dehydration and shock
- Cholera spreading through a shared water source
- Electrolyte injury from incorrectly mixed ORS
- Needlestick and body-fluid exposure
resource_budget:
  batch: one patient with acute watery diarrhoea
  labor_hours: 1
  energy_kwh: 0
  water_liters: 5
lifespan: ORS and zinc remain effective until the printed expiry if kept dry
maintenance: Check stock monthly and retrain on dehydration classification each season
limits:
- Do not use antibiotics for uncomplicated watery diarrhoea
- Do not give concentrated or incorrectly mixed ORS
- Severe dehydration needs urgent referral or intravenous fluids
