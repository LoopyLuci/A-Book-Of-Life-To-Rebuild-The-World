- Compass or GPS
- Whistles and signal mirrors
- High-visibility vests
- Headlamps and batteries
- First aid kit and patient packaging
- Flagging tape and clue markers
tools_required:
- Radio or charged phones
- Notebook and pencil
- GPS or compass
- Knife
- Walking staff
