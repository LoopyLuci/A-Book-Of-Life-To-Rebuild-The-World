- Gloves, masks, eye protection, gowns
- Disinfectant
- Sharps container
- Sterilizer or pressure cooker
- Waste bags and labels
tools_required:
- Handwashing station
- Thermometer and timer
- Cleaning brushes
- Sterilizer gauge
- PPE
