safety: yellow
time_to_complete: hours
yield: A clinic or household routine that breaks hand, surface, and sharps transmission routes
season: Year-round; intensify during outbreaks and after floods
storage: Keep PPE and disinfectant stock dry, labelled, and within expiry
cost: low
hazards:
- Bloodborne pathogen exposure
- Chemical irritation from disinfectants
- Burns and pressure failure during sterilization
- Needlestick injuries
resource_budget:
  batch: one 10-bed clinic shift
  labor_hours: 8
  energy_kwh: 5
  water_liters: 50
lifespan: PPE is single-use; sterilized instruments remain sterile only in sealed packs
maintenance: Audit hand hygiene weekly, restock stations daily, and test the sterilizer monthly
limits:
- Alcohol rub does not inactivate bacterial spores
- Do not reuse gloves or single-use needles
- Sterilization requires a validated cycle, not just boiling water
