hazards:
  - 극도의 열과 극저온 액체; 숙련된 취급자만 사용한다.
  - 독성 및 부식성 공정 가스; 경보와 환기를 확인한다.
  - 방사능 및 자외선 노출; 차폐 장비를 사용한다.
  - 클린룸 절차는 선택 사항이 아니라 안전 관리 수단이다.
limits:
  - 자본 장비와 전문적인 공정 관리가 필요하다.
  - 기술 수율과 비용은 성숙한 생산의 일반적인 수준이다.
