hazards:
  - 뜨거운 접착제와 이중 가열 통에 의한 화상
  - 석회나 붕산에 의한 부식성 화상
  - 녹말 풀과 hide 접착제에서 생기는 곰팡이
  - 부하를 받다 약해지는 접합부의 파손
limits:
  - 녹말과 hide 접착제는 방수되지 않는다
  - 카신은 내수성이 있지만 안전이 중요한 하중용 구조 접착제는 아니다
  - 음식이나 음수 접촉면에는 원인 불명의 접착제를 쓰지 않는다
