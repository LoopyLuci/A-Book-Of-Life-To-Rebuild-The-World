[project]
name = "a-book-of-life"
version = "1.0.0"
description = "A Book Of Life To Rebuild The World — an offline-first knowledge engine."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "A Book Of Life Contributors" }]

[project.scripts]
abook-validate = "scripts.validate:validate"
abook-build = "scripts.build_index:build"
abook-search = "scripts.search:main"
abook-serve = "scripts.serve:app"
abook-mcp = "scripts.mcp_server:main"
abook-rag = "scripts.rag:main"
abook-bundle = "scripts.build_zim:build"
abook-new = "scripts.new_entry:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# The rule set is pinned so that a lint run means the same thing on every
# machine and on every future version of ruff.
select = [
    "E4",     # pycodestyle, import-time errors
    "E7",
    "E9",
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # import order
    "B",      # bugbear
    "UP",     # pyupgrade
    "C4",     # comprehensions
    "DTZ",    # naive datetimes
    "BLE",    # blind except
]
ignore = [
    "S101",   # assert is fine in scripts and tests
    "B008",   # a call in a default argument is intentional here
]

[tool.ruff.lint.per-file-ignores]
# The data tables and the long template strings in these files are
# deliberately wide; they are read as tables, not as code.
"android/tools/export_content.py" = ["E501"]
"scripts/build_bundle.py" = ["E501"]
"scripts/build_zim.py" = ["E501"]
"scripts/dashboard.py" = ["E501"]
"scripts/serve.py" = ["E501"]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite imports `scripts.` as a package. `python -m pytest` puts the
# working directory on sys.path by itself, but the bare `pytest` console
# script (what CI runs) does not, so the root is added explicitly.
pythonpath = ["."]
