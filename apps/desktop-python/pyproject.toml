[project]
name = "abook-desktop"
# Mirrors [project] version in the repository manifest.toml.
version = "0.1.0-alpha"
description = "Offline desktop reader for the A Book Of Life To Rebuild The World knowledge base"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "A Book Of Life Contributors" }]
keywords = ["knowledge-base", "offline", "desktop", "tkinter", "reference"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Text Processing :: Markup",
]

# The reader is dependency free on purpose: everything it needs ships with
# CPython (tkinter, sqlite3, tomllib, logging) and the YAML it reads is
# parsed by abook.yamlmini.
dependencies = []

[project.scripts]
abook-desktop = "abook.cli:main"

[project.gui-scripts]
abook-desktop-gui = "abook.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["abook"]

[tool.setuptools.package-data]
abook = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
