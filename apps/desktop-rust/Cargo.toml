[package]
name = "abook-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A native, offline desktop reader for the Book of Life knowledge base"
license = "MIT"
readme = "README.md"
publish = false

[[bin]]
name = "abook-desktop"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true
