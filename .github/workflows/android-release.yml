name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install content exporter dependencies
        run: pip install "PyYAML>=6.0"

      - name: Regenerate app content assets
        run: python android/tools/export_content.py

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ABOOK_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ABOOK_RELEASE_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/release.jks"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Run unit tests
        working-directory: android
        run: ./gradlew test --console=plain

      - name: Assemble signed release APK
        working-directory: android
        env:
          ABOOK_RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          ABOOK_RELEASE_STORE_PASSWORD: ${{ secrets.ABOOK_RELEASE_STORE_PASSWORD }}
          ABOOK_RELEASE_KEY_ALIAS: ${{ secrets.ABOOK_RELEASE_KEY_ALIAS }}
          ABOOK_RELEASE_KEY_PASSWORD: ${{ secrets.ABOOK_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain

      - name: Stage release artifact
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
            "abook-of-life-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "abook-of-life-${GITHUB_REF_NAME}.apk" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
