# Android CI/CD Pipeline - GitHub Actions Workflow
# This workflow replaces the broken android-emulator.yml with a robust local CI/CD pipeline
#
# Key improvements over the original:
# - Full preflight checks (environment, dependencies, disk space)
# - Build automation with caching and incremental builds
# - Comprehensive test execution (unit, instrumentation, UI)
# - Device management (adb/fastboot, provisioning, rollback)
# - Post-deployment validation
# - Performance monitoring
# - Configurable stages and parameters
#
# Stages:
#   1. preflight - Ensure environment and prerequisites are met
#   2. build - Compile the Android app with caching
#   3. test - Run unit and instrumentation tests
#   4. deploy - Deploy to connected devices
#   5. validate - Post-deployment validation
#   6. performance - Monitor app performance and collect metrics
#
# Usage:
#   - Run all stages: ./android/ci/run.sh all
#   - Run specific stage: ./android/ci/run.sh build
#   - Skip tests: ./android/ci/run.sh --skip-tests
#   - Clean build: ./android/ci/run.sh --clean
#
# Configuration:
#   - BUILD_VARIANT: debug or release
#   - STAGE: preflight, build, test, deploy, validate, performance, all
#   - ANDROID_CI_LOGS: log directory
#   - ANDROID_CI_ARTIFACTS: artifacts directory
#
# See android/ci/config.yaml for detailed configuration
