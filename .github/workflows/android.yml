name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "domains/**"
      - "sidecars/**"
      - "i18n/**"
      - "manifest.toml"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "domains/**"
      - "sidecars/**"
      - "i18n/**"
      - "manifest.toml"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install content exporter dependencies
        run: pip install "PyYAML>=6.0"

      - name: Regenerate app content assets
        run: python android/tools/export_content.py

      - name: Verify generated content is committed
        run: git diff --exit-code -- android/app/src/main/assets android/app/src/main/res android/core/designsystem/src/main/res

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Run unit tests
        working-directory: android
        run: ./gradlew test --console=plain

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
