name: Annual Archive

on:
  schedule:
    - cron: "0 6 1 1 *"   # January 1st at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt internetarchive requests

      - name: Build index
        run: python scripts/build_index.py

      - name: Archive to Internet Archive and Zenodo
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: python scripts/archive.py --target all

      - uses: actions/upload-artifact@v4
        with:
          name: archive-manifest
          path: build/archive/
