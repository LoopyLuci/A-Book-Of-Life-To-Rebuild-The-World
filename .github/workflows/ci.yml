name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate sidecars
        run: python scripts/validate.py
      - name: Validate field tests
        run: python scripts/validate_field_tests.py
      - name: Build index
        run: python scripts/build_index.py
      - name: Build dashboard
        run: python scripts/dashboard.py
      - name: Run tests
        run: pytest -v
      - uses: actions/upload-artifact@v4
        with:
          name: index-and-dashboard
          path: |
            build/index.db
            build/dashboard.html

  application-readers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web-ts/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: apps/web-rails/.ruby-version
          bundler-cache: true
          working-directory: apps/web-rails
      - name: Install native desktop build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libgl1-mesa-dev libwayland-dev libx11-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxrandr-dev
      - name: Install Python test runner
        run: python -m pip install pytest
      - name: Install TypeScript app dependencies
        run: npm ci --prefix apps/web-ts
      - name: Test Python desktop reader
        run: python -m pytest apps/desktop-python/tests -q
      - name: Test and lint Rust desktop reader
        run: |
          cargo test --manifest-path apps/desktop-rust/Cargo.toml
          cargo clippy --manifest-path apps/desktop-rust/Cargo.toml --all-targets -- -D warnings
      - name: Test TypeScript web reader
        run: |
          npm --prefix apps/web-ts run test
          npm --prefix apps/web-ts run build
      - name: Test Rails web reader
        run: ruby -Capps/web-rails bin/rails test
      - name: Test PowerShell terminal reader
        run: pwsh -NoProfile -File apps/powershell/tests/run-tests.ps1
      - name: Test POSIX shell reader
        run: sh apps/shell/tests/run-tests.sh

  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "domains/**/*.md"

  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress 'domains/**/*.md'
          fail: true

  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install openscad
        run: sudo apt-get update && sudo apt-get install -y openscad
      - run: python scripts/build_models.py

  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/build_media.py

  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/validate_i18n.py
      - run: python scripts/build_i18n.py

  variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/build_variants.py

  simulators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate simulator HTML (basic well-formedness)
        run: |
          for f in simulators/*.html; do
            [ -f "$f" ] || continue
            grep -q "<!DOCTYPE html>" "$f" || (echo "Missing doctype: $f" && exit 1)
            grep -q "</html>" "$f" || (echo "Missing closing html: $f" && exit 1)
          done

  sdk-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the SDK
        run: pip install "sdk/python[dev]"
      # A wheel that ships no code installs cleanly and then fails on import,
      # which is how this job broke: hatchling applied a root-anchored ignore
      # rule above the project and quietly dropped the whole package. Check the
      # artifact itself, not only the result of importing it.
      - name: Check the wheel ships the package
        run: |
          python -m pip wheel sdk/python --no-deps -w /tmp/wheels --no-cache-dir
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("/tmp/wheels/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = ["abook/__init__.py", "abook/client.py"]
          missing = [name for name in required if name not in names]
          if missing:
              raise SystemExit(f"{wheel} ships no {', '.join(missing)}: {names}")
          print(f"{wheel}: {len(names)} entries")
          PY
      # Proves the package is importable from an installed wheel, which is
      # what a consumer gets. The test run below then works from the source
      # tree, the same way the local pipeline runs it.
      - name: Import check
        run: python -c "import abook; print(abook.__file__)"
      - name: Test the SDK
        working-directory: sdk/python
        run: pytest tests -v

  sdk-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: sdk/typescript
        run: |
          npm ci || npm install
          npm run build
          npm test

  sdk-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - working-directory: sdk/rust
        run: |
          cargo build --verbose
          cargo test --verbose

  federation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt cryptography
      - name: Verify identity creation
        run: |
          python scripts/federation.py identity
          python scripts/federation.py manifest | head -40

  state-of-the-book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/build_index.py
      - run: python scripts/state_of_the_book.py --year $(date +%Y)
      - uses: actions/upload-artifact@v4
        with:
          name: state-of-the-book
          path: build/reports/

  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify CHANGELOG has Unreleased section
        run: grep -q "## \[Unreleased\]" CHANGELOG.md

  continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify governance files exist
        run: |
          for f in \
            governance/CHARTER.md \
            governance/ROLES.md \
            governance/DECISION-LOG.md \
            governance/DEPRECATION.md \
            governance/CONTINUITY.md \
            governance/FISCAL-SPONSORSHIP.md \
            governance/ROTATION.md \
            governance/ROADMAP.md \
            MAINTAINERS.md \
            CHANGELOG.md; do
            [ -f "$f" ] || (echo "Missing: $f" && exit 1)
          done

  funding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify FUNDING.yml
        run: |
          [ -f FUNDING.yml ] || (echo "Missing FUNDING.yml" && exit 1)
          grep -q "open_collective" FUNDING.yml

  codeowners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify CODEOWNERS
        run: |
          [ -f .github/CODEOWNERS ] || (echo "Missing CODEOWNERS" && exit 1)
