name: Android Emulator Tests

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "domains/**"
      - "sidecars/**"
      - "i18n/**"
      - "manifest.toml"
      - ".github/workflows/android-emulator.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "domains/**"
      - "sidecars/**"
      - "i18n/**"
      - "manifest.toml"
      - ".github/workflows/android-emulator.yml"
  workflow_dispatch:

concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumentation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 26
            target: default
            arch: x86
          - api-level: 31
            target: google_apis
            arch: x86_64
          - api-level: 35
            target: google_apis
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install content exporter dependencies
        run: pip install "PyYAML>=6.0"

      - name: Regenerate app content assets
        run: python android/tools/export_content.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation tests (API ${{ matrix.api-level }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          disable-animations: true
          emulator-options: -no-snapshot -no-boot-anim -memory 2048
          working-directory: android
          script: ./gradlew :app:connectedDebugAndroidTest --console=plain
